<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1a2e">
<title>BLOCKFIRE — Cube Shooter</title>
<style>
:root{--blue:#1e8bff;--navy:#0e2340;--navy2:#16365e;--yel:#ffc928;--grn:#35d34f;--red:#ff4a3d;--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1a2e;color:#fff;font-family:"Oswald","Bebas Neue","Impact","Haettenschweiler","Arial Narrow Bold","Arial Narrow",system-ui,sans-serif;font-weight:700;letter-spacing:.03em;overscroll-behavior:none;font-size:16px}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none;z-index:2}
body.playing #gl{cursor:none}
.hidden{display:none!important}
button{font-family:inherit;font-weight:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;border:0}
.ov,.ov *{touch-action:manipulation}
.ov{position:fixed;inset:0;z-index:20}
#tz{position:fixed;inset:0;z-index:5;display:none}
body.touch.playing #tz{display:block}
#touch{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
body.touch.playing #touch{display:block}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(110,115,130,.5);border:.18rem solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;touch-action:none;color:#fff}
.tb svg{width:58%;height:58%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tb.on{background:rgba(255,255,255,.45);transform:scale(.94)}
.tb small{position:absolute;bottom:.15rem;font-size:.55rem;opacity:.85}
.tb.ow{display:none}body.ow .tb.ow{display:flex}
#bFire{background:rgba(255,90,60,.45);border-color:rgba(255,200,180,.7)}
.tb.sel{outline:.22rem solid var(--yel);background:rgba(255,225,74,.35)}
.tb.pnl{border-radius:14px}
body.editing .tb.pnl{border:.18rem dashed #ffe14a;background:rgba(255,225,74,.12)}
body.editing #touch{display:block!important;z-index:25}
body.editing .tb{cursor:grab}
#edbar{position:fixed;left:50%;top:.6rem;transform:translateX(-50%);z-index:30;background:rgba(10,24,45,.92);border-radius:.7rem;padding:.5rem .7rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;max-width:94vw;font-size:.85rem}
#edbar input{width:9rem;accent-color:var(--yel)}
#edbar button{height:2.2rem;padding:0 .9rem;border-radius:.4rem;background:var(--grn);color:#073b10;font-size:.95rem}
#edbar button.rs{background:#6c7c99;color:#fff}
#edbar .hint{flex-basis:100%;text-align:center;opacity:.85;font-size:.75rem}
.row select{flex:1;background:var(--navy2);color:#fff;border:0;border-radius:.4rem;padding:.35rem;font:inherit}
/* ---------- menu ---------- */
#menu{display:flex;flex-direction:column;padding:calc(.7rem + var(--st)) calc(.9rem + var(--sr)) calc(.7rem + var(--sb)) calc(.9rem + var(--sl));pointer-events:none}
#menu>*{pointer-events:auto}
#mTop{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem;pointer-events:none}
#mTop>*{pointer-events:auto}
.tabs{display:flex;gap:.5rem}
.tab{width:4.1rem;height:3.6rem;border-radius:.6rem;background:var(--navy2);display:flex;align-items:center;justify-content:center;border-bottom:.22rem solid #0a1a30;opacity:.9}
.tab svg{width:62%;height:62%;fill:currentColor;stroke:currentColor}
.tab.on{background:var(--blue);border-bottom-color:#0b5fc0;opacity:1}
.coinBox{display:flex;align-items:center;gap:.5rem;background:rgba(10,24,45,.8);border-radius:.6rem;padding:.3rem .5rem;font-size:1.2rem}
.coinBox i{font-style:normal;color:var(--yel)}
.coinBox button{width:2rem;height:2rem;border-radius:.4rem;background:var(--yel);color:#3a2800;font-size:1.3rem;line-height:1}
#panels{flex:1;position:relative;min-height:0;pointer-events:none}
#panels>div{position:absolute;inset:0;pointer-events:none}
#panels>div>*{pointer-events:auto}
.chips{display:flex;gap:.45rem;margin-top:.5rem;flex-wrap:wrap}
.chip{min-width:3.9rem;height:2.5rem;padding:0 .7rem;border-radius:.5rem;background:var(--navy2);font-size:.95rem;display:flex;align-items:center;justify-content:center;border-bottom:.18rem solid #0a1a30}
.chip.on{background:var(--blue);border-bottom-color:#0b5fc0}
.wsel{position:absolute;left:50%;bottom:.6rem;transform:translateX(-50%);display:flex;align-items:center;gap:1.4rem}
.wsel .nm{font-size:2.1rem;min-width:12rem;text-align:center;text-shadow:0 .15rem .4rem rgba(0,0,0,.6)}
.wsel .nm small{display:block;font-size:.8rem;opacity:.8}
.arrow{width:3rem;height:3rem;background:transparent;font-size:2.2rem;color:#fff;opacity:.9}
.stats{position:absolute;left:0;bottom:.6rem;width:13rem;background:rgba(10,24,45,.72);border-radius:.6rem;padding:.55rem .7rem}
.sb{display:flex;align-items:center;gap:.5rem;font-size:.8rem;margin:.22rem 0}
.sb span{width:4.4rem;opacity:.85}
.sb div{flex:1;height:.45rem;background:#0a1a30;border-radius:.3rem;overflow:hidden}
.sb b{display:block;height:100%;background:var(--blue)}
.skcol{position:absolute;right:0;top:3.2rem;bottom:4.5rem;width:15.5rem;background:rgba(10,24,45,.72);border-radius:.6rem;padding:.55rem;display:flex;flex-direction:column;gap:.5rem}
.skcol h4{margin:0;font-size:.85rem;opacity:.8}
.skg{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;align-content:start}
.sk{aspect-ratio:1;border-radius:.45rem;border:.16rem solid var(--rc,#888);position:relative;cursor:pointer;background:#111}
.sk.on{outline:.2rem solid #fff}
.sk em{position:absolute;inset:auto 0 0 0;font-style:normal;font-size:.62rem;text-align:center;background:rgba(0,0,0,.6);padding:.08rem}
.sk.lock::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.go{height:2.7rem;border-radius:.5rem;background:var(--grn);color:#073b10;font-size:1.15rem;border-bottom:.22rem solid #1b8a2e}
.go.buy{background:var(--yel);color:#3a2800;border-bottom-color:#b88a00}
.play{pointer-events:auto;position:absolute;right:0;bottom:.6rem;width:15.5rem;height:3.4rem;border-radius:.6rem;background:var(--grn);color:#073b10;font-size:1.7rem;border-bottom:.26rem solid #1b8a2e}
.pad{position:absolute;left:0;top:.2rem;width:min(34rem,100%);background:rgba(10,24,45,.78);border-radius:.7rem;padding:.8rem .9rem;max-height:100%;overflow:auto}
.pad h4{margin:.2rem 0 .4rem;font-size:.95rem;color:var(--yel)}
.cards{display:flex;gap:.6rem;flex-wrap:wrap}
.card{flex:1;min-width:9rem;border-radius:.6rem;background:var(--navy2);padding:.5rem;border-bottom:.2rem solid #0a1a30;font-size:.9rem}
.card.on{background:var(--blue);border-bottom-color:#0b5fc0}
.card small{display:block;opacity:.8;font-size:.7rem;font-weight:600;margin-top:.2rem}
.row{display:flex;align-items:center;gap:.6rem;margin:.5rem 0;font-size:.85rem}
.row label{width:9rem;opacity:.9}
.row input[type=range]{flex:1;accent-color:var(--yel)}
.row span{width:2.4rem;text-align:right}
.sw{width:2.6rem;height:2.6rem;border-radius:.4rem;border:.16rem solid transparent;cursor:pointer}
.sw.on{border-color:#fff}
.help{font-size:.7rem;font-weight:600;opacity:.8;line-height:1.5;margin-top:.4rem}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(30rem,94%);background:rgba(10,24,45,.94);border-radius:.9rem;padding:1.1rem;text-align:center;max-height:96%;overflow:auto;border:.15rem solid rgba(255,255,255,.12)}
.panel h2{margin:0 0 .6rem;font-size:2.4rem}
.panel h2.win{color:var(--grn)}.panel h2.lose{color:var(--red)}
.panel .go{width:100%;margin-top:.5rem}
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.6rem 0}
.stg div{background:var(--navy2);border-radius:.5rem;padding:.4rem;font-size:1.3rem}
.stg small{display:block;font-size:.6rem;opacity:.7;letter-spacing:.1em}
#pause,#over,#msg{background:rgba(4,10,20,.6)}
#msg{display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.2rem;padding:2rem}
@media (orientation:portrait){
 #mTop{flex-direction:column;align-items:stretch}
 .tabs{justify-content:center}.tab{flex:1;width:auto}
 .coinBox{position:absolute;right:.9rem;bottom:calc(8.4rem + var(--sb));font-size:1rem}
 .pad{width:100%;max-height:36%}
 .wsel{bottom:4.6rem;gap:.4rem}.wsel .nm{font-size:1.6rem;min-width:9rem}
 .play{left:0;right:0;width:100%;margin:0 auto}
 .stats{width:100%;bottom:8rem;display:none}
 .skcol{left:0;right:0;width:auto;top:auto;bottom:8.2rem;height:30%}
 .skg{grid-template-columns:repeat(5,1fr)}
 #pW .stats{display:none}
}
#hsel{display:none}
#pM #hsel{display:flex}

.lbtns{display:flex;gap:.5rem;margin:.5rem 0}.lbtns .go{flex:1}
.go.alt{background:#6c7c99;color:#fff;border-bottom-color:#46536b}
.roomcode{font-size:1.2rem;margin:.4rem 0}.roomcode b{color:var(--yel);letter-spacing:.2em;font-size:1.5rem}
.row input[type=text]{flex:1;min-width:0;background:var(--navy2);color:#fff;border:0;border-radius:.4rem;padding:.35rem;font:inherit}
.lobbyP .help{text-align:center;line-height:1.6}
.attcol{position:absolute;left:0;top:3.2rem;width:15.5rem;max-height:calc(100% - 9rem);overflow:auto;background:rgba(10,24,45,.72);border-radius:.6rem;padding:.5rem .6rem}
.attcol h4{margin:.3rem 0 .25rem;font-size:.8rem;opacity:.85}
.attcol .ar{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.2rem}
.attcol .ab{min-width:3rem;height:2rem;padding:0 .4rem;border-radius:.4rem;background:var(--navy2);font-size:.8rem;border-bottom:.15rem solid #0a1a30}
.attcol .ab.on{background:var(--blue);border-bottom-color:#0b5fc0}
@media (orientation:portrait){.attcol{top:.3rem;left:0;right:0;width:auto;max-height:28%}}
#armory{position:absolute;left:50%;transform:translateX(-50%);top:4.4rem;width:min(33rem,calc(100% - 36rem));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;z-index:2}
.ar-card{background:#201842;border:2px solid #3a2c6c;border-radius:.75rem;padding:.5rem .55rem;display:flex;flex-direction:column;gap:.25rem;cursor:pointer;min-width:0}
.ar-card.on{border-color:#3b82f6;box-shadow:0 0 .9rem rgba(59,130,246,.55)}
.ar-card h4{margin:0;font-size:.8rem;color:#fff;line-height:1.3}
.ar-card.on h4{color:#60a5fa}
.ar-ic svg{width:100%;height:auto;display:block;filter:drop-shadow(0 .15rem .15rem rgba(0,0,0,.45))}
.ar-st{font-size:.68rem;color:#b0a8d0;line-height:1.55}
.ar-card button{background:#475569;color:#fff;border:0;border-radius:.4rem;padding:.3rem;font-weight:bold;font-size:.75rem;cursor:pointer}
.ar-card.on button{background:#3b82f6}
#pW .wsel,#pW .stats{display:none!important}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="tz"></div>
<div id="touch">
  <div class="tb" id="bMenu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
  <div class="tb" id="bSwap"><svg viewBox="0 0 32 24"><path d="M2 12h16l2-3h6l1 3h3v3h-9l-2 5h-4l1-5H2z"/></svg></div>
  <div class="tb" id="bJump"><svg viewBox="0 0 24 24"><path d="M12 18V6M6 12l6-6 6 6M6 21h12"/></svg></div>
  <div class="tb" id="bAim"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg></div>
  <div class="tb hidden" id="bSkill"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.6L20 10l-5.6 2.4L12 18l-2.4-5.6L4 10l5.6-2.4z"/><path d="M18.5 15.5l.9 2 2 .9-2 .9-.9 2-.9-2-2-.9 2-.9z"/></svg><span id="bSkillT" style="position:absolute;bottom:-.15rem;font:bold .7rem sans-serif;color:#fff;text-shadow:0 0 3px #000"></span></div>
  <div class="tb hidden" id="bVoice"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
  <div class="tb pnl hidden" id="pdHp"></div>
  <div class="tb pnl hidden" id="pdAm"></div>
  <div class="tb pnl hidden" id="pdTop"></div>
  <div class="tb pnl hidden" id="pdFps"></div>
  <div class="tb pnl hidden" id="pdFeed"></div>
  <div class="tb hidden" id="bOpp"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg></div>
  <div class="tb" id="bFire"><svg viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M5 16l5-5M8 19l6-6M11 21l7-7M13 6l5 5 3-6z"/></svg></div>
  <div class="tb" id="bReload"><svg viewBox="0 0 24 24"><path d="M6 17l5-9M10 19l5-9M14 21l5-9"/></svg></div>
  <div class="tb" id="bCrouch"><svg viewBox="0 0 24 24"><path d="M6 8l6 6 6-6M6 15l6 6 6-6"/></svg></div>
  <div class="tb" id="bNade"><svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="6"/><path d="M10 8V5h4v3M14 5l4-2"/></svg></div>
  <div class="tb" id="bKnife"><svg viewBox="0 0 24 24"><path d="M4 20l10-10 6-6-2 8-6 6zM4 20l3-3"/></svg></div>
  <div class="tb" id="bSlide"><svg viewBox="0 0 24 24"><path d="M3 16h12l4-6h2M9 16l-2 4"/></svg></div>
  <div class="tb ow" id="bUse" style="background:rgba(70,200,110,.5)"><svg viewBox="0 0 24 24"><path d="M9 3l-4 9h5l-2 9 9-12h-6l3-6z"/></svg></div>
  <div class="tb ow" id="bBag"><svg viewBox="0 0 24 24"><path d="M7 8V6a5 5 0 0 1 10 0v2M5 8h14l1 13H4z"/></svg></div>
  <div class="tb ow" id="bHeal" style="background:rgba(230,70,90,.5)"><svg viewBox="0 0 24 24"><path d="M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6z"/></svg></div>
  <div class="tb ow" id="bLamp"><svg viewBox="0 0 24 24"><path d="M9 21h6M10 17h4M8 13a5 5 0 1 1 8 0c-1 1-2 2-2 4h-4c0-2-1-3-2-4z"/></svg></div>
</div>

<div id="edbar" class="hidden"><span data-i18n="editHint" class="hint"></span><label data-i18n="editSize"></label><input type="range" id="edSize" min="50" max="220"><button class="rs" id="edReset" data-i18n="editReset"></button><button id="edDone" data-i18n="editDone"></button></div>
<div id="menu" class="ov">
  <div id="mTop">
    <div>
      <div class="tabs" id="tabs">
                <button class="tab on" data-t="m" title="Match"><svg viewBox="0 0 32 32"><path d="M7 3v26M7 5h17l-4 6 4 6H7" style="fill:none;stroke-width:3"/></svg></button>
        <button class="tab" data-t="w" title="Weapons"><svg viewBox="0 0 64 32"><path d="M2 12h34l4-4h10l2 4h10v6H44l-4 8h-8l2-8H24l-4 6h-6l2-6H2z"/></svg></button>
        <button class="tab" data-t="c" title="Character"><svg viewBox="0 0 32 32"><path d="M4 19a12 12 0 0 1 24 0v3H4zM3 23h26v4H3z"/></svg></button>
        <button class="tab" data-t="s" title="Settings"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="5" style="fill:none;stroke-width:3"/><path d="M16 3v5M16 24v5M3 16h5M24 16h5M7 7l3 3M22 22l3 3M25 7l-3 3M10 22l-3 3" style="stroke-width:3"/></svg></button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="coinBox"><i>◆</i><b id="coins">0</b><button id="btnShop">+</button></div>
  </div>
  <div id="panels">
    <div id="pW">
      <div class="stats" id="stats"></div>
      <div id="armory"></div>
      <div class="attcol" id="attCol"></div>
      <div class="wsel"><button class="arrow" id="prevW">◀</button><div class="nm" id="wName"></div><button class="arrow" id="nextW">▶</button></div>
      <div class="skcol"><h4 id="skTitle">SKINS</h4><div class="skg" id="skg"></div><button class="go" id="btnSkin">EQUIP</button></div>
    </div>
    <div id="pC" class="hidden">
      <div class="pad">
        <h4 data-i18n="outfit">OUTFIT</h4><div class="cards" id="outfits"></div>
        <h4 data-i18n="headgear">HEADGEAR</h4><div class="cards" id="heads"></div>
        <div class="help" data-i18n="outfitHelp">Your sleeves and gloves in first person follow the outfit you choose.</div>
      </div>
    </div>
    <div id="pM" class="hidden">
      <div class="pad">
        <h4 data-i18n="modeT">GAME MODE</h4><div class="cards" id="modes"></div>
        <h4 data-i18n="map">MAP</h4><div class="cards" id="maps"></div>
        <h4 data-i18n="diff">DIFFICULTY</h4><div class="cards" id="diffs"></div>
        <h4 data-i18n="scoreLimit">SCORE LIMIT</h4><div class="cards" id="limits"></div>
        <button class="go" id="btnOnline" data-i18n="online" style="width:100%;margin-top:.6rem">PLAY ONLINE</button>
        <div class="help" id="mHelp"></div>
      </div>
      <div id="hsel" class="wsel"><button class="arrow" id="prevH">◀</button><div class="nm" id="hName"></div><button class="arrow" id="nextH">▶</button></div>
    </div>
    <div id="pS" class="hidden"><div class="pad"><div id="setMenu"></div>
      <div class="help" data-i18n-html="pcHelp"></div>
    </div></div>
    <button class="play" id="btnPlay" data-i18n="play">PLAY</button>
  </div>
</div>


<div id="lobby" class="ov hidden"><div class="panel lobbyP">
  <h2 data-i18n="onlineT">ONLINE</h2>
  <div class="row"><label data-i18n="srv"></label><input id="lSrv" type="text" dir="ltr"></div>
  <div class="row"><label data-i18n="yname"></label><input id="lName" type="text" maxlength="12"></div>
  <div class="row" id="lCode" style="display:flex"><label data-i18n="rcode"></label><input id="lCodeIn" type="text" maxlength="4" dir="ltr" style="text-transform:uppercase"></div>
  <div class="lbtns"><button class="go" id="lCreate" data-i18n="create"></button><button class="go" id="lJoin" data-i18n="join"></button></div>
  <div id="lRoom" class="hidden">
    <div class="roomcode"><span data-i18n="roomLbl"></span> <b id="lCodeShow" dir="ltr"></b></div>
    <div id="lPlayers" class="help"></div>
    <button class="go alt" id="lVoice"></button>
    <div class="lbtns"><button class="go" id="lStart" data-i18n="startGame"></button><button class="go alt" id="lLeave" data-i18n="leave"></button></div>
  </div>
  <div class="help" id="lMsg"></div>
  <button class="go alt" id="lClose" data-i18n="close"></button>
</div></div>
<div id="pause" class="ov hidden"><div class="panel"><h2 data-i18n="paused">PAUSED</h2><div id="setPause"></div>
  <button class="go" id="btnResume" data-i18n="resume">RESUME</button><button class="go" id="btnRestart" data-i18n="restart" style="background:#6c7c99;border-bottom-color:#46536b;color:#fff">RESTART MATCH</button><button class="go" id="btnQuit" data-i18n="mainMenu" style="background:#6c7c99;border-bottom-color:#46536b;color:#fff">MAIN MENU</button></div></div>
<div id="over" class="ov hidden"><div class="panel"><h2 id="oTitle">VICTORY</h2><div id="oSub" class="help"></div><div class="stg" id="oStats"></div>
  <button class="go" id="btnAgain" data-i18n="playAgain">PLAY AGAIN</button><button class="go" id="btnMenu" data-i18n="mainMenu" style="background:#6c7c99;border-bottom-color:#46536b;color:#fff">MAIN MENU</button></div></div>
<div id="msg" class="ov hidden">Your browser does not support WebGL. Please open this game in a recent Chrome, Edge, Safari or Firefox.</div>
<script>
(() => {
'use strict';
/* ============ CORE: utils, persistence, audio ============ */
const $=id=>document.getElementById(id);
const PI=Math.PI,TAU=PI*2,D2R=PI/180;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),rndi=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const damp=(r,dt)=>1-Math.exp(-r*dt);
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* ---- plane passes: one pass flies across the island; respawned players drop in the current pass ---- */
function royStart(){const a=rnd(0,TAU);ROY.dx=Math.cos(a);ROY.dz=Math.sin(a);ROY.spd=26;ROY.t=0;ROY.dur=2.3*WH/ROY.spd;ROY.passT=0;ROY.passEnd=ROY.dur;ROY.on=true;
 const za=rnd(0,TAU),zd=rnd(20,WH*.6);ROY.zt=[Math.cos(za)*zd,Math.sin(za)*zd];}
function royNewPass(){const a=rnd(0,TAU);ROY.dx=Math.cos(a);ROY.dz=Math.sin(a);ROY.passT=ROY.t;ROY.passEnd=ROY.t+ROY.dur;ROY.on=true;}
function royPlanePos(){const s=-1.15*WH+(ROY.t-ROY.passT)*ROY.spd;return[ROY.dx*s,ROY.dz*s];}
function royActive(){let n=0;for(const h of PL)if(!h.out)n++;return n;}
function royAlive(){let n=0;for(const h of PL)if(h.alive)n++;return n;}
function royNearest(h,r){let b=null,bd=r;for(const it of ROY.loot){const d=Math.hypot(it.x-h.x,it.z-h.z);if(d<bd){bd=d;b=it;}}return b;}
/* ---- shrinking zone: whole island for 5 min, then it contracts toward a random point ---- */
function royZoneR(){const t=ROY.t-ROY_ZONE_WAIT;if(t<=0)return WH*1.15;const p=Math.min(1,t/ROY_ZONE_TIME);return lerp(WH*1.15,ROY_ZONE_END,p);}
function royZoneC(){const t=ROY.t-ROY_ZONE_WAIT;if(t<=0)return[0,0];const p=Math.min(1,t/ROY_ZONE_TIME);return[ROY.zt[0]*p,ROY.zt[1]*p];}
function royZone(dt){const R=royZoneR(),c=royZoneC();for(const h of PL){if(!h.alive||h.inPlane||h.para)continue;h.landT=(h.landT||0)+dt;
  if(Math.hypot(h.x-c[0],h.z-c[1])<=R)continue;h.hp-=3*dt;h.lastHitT=M.t;if(h===PL[0])M.flash=Math.min(.9,M.flash+.04);if(h.hp<=0){h.hp=0;killHuman(h,null,false);}}}
/* ---- health and armor regeneration: royale refills armor only, other modes refill both ---- */
function regenTick(h,dt){
 if(!h.alive||h.inPlane||h.para)return;const quiet=M.t-(h.lastHitT||-99);
 if(isOpen()){if(h===PL[0]&&quiet>8)h.hp=Math.min(100,h.hp+2.5*dt);return;}
 if(isRoyale()){if(quiet>6)h.arm=Math.min(150,(h.arm||0)+15*dt);return;}
 if(quiet>5){h.hp=Math.min(100,h.hp+18*dt);h.arm=Math.min(50,(h.arm||0)+18*dt);}
}

  h.wid=['pistol','pistol'];h.slot=0;h.ammo=[WEAPONS.pistol.mag,WEAPONS.pistol.mag];h.res=[WEAPONS.pistol.res,WEAPONS.pistol.res];
  h.alive=true;h.out=false;h.hp=100;h.arm=0;h.spawnProt=0;h.reload=0;h.landT=0;h.rsT=0;
  h.inPlane=true;h.para=false;h.paraT=0;h.gA=rnd(0,TAU);h.yaw=yaw0;h.pitch=0;

/* ---- plane ride, parachute glide and landing ---- */
function royaleAir(h,dt){
 if(h.inPlane){
  const p=royPlanePos();h.x=p[0];h.z=p[1];h.y=ROY.alt;h.vx=h.vz=h.vy=0;
  if(h===PL[0]){const sens=IN.touch?SET.tsens*.0042:SET.sens*.0022,inv=SET.invert?-1:1;h.yaw-=IN.mdx*sens;h.pitch=clamp(h.pitch-IN.mdy*sens*inv,-1.35,1.35);IN.mdx=0;IN.mdy=0;}
  const go=h===PL[0]?(IN.jumpEdge||IN.fire):ROY.t>=h.dropAt;
  if(go||ROY.t>=ROY.passEnd){h.inPlane=false;h.para=true;h.paraT=0;h.vx=ROY.dx*4;h.vz=ROY.dz*4;h.vy=-2;
   if(h===PL[0]){IN.jumpEdge=false;SFX.jump();M.banner=T('royChute');M.bannerT=1.6;}}
  return;
 }
 h.paraT+=dt;let wx,wz;
 if(h===PL[0]){const k=clamp((kd('KeyW')||kd('ArrowUp')?1:0)-(kd('KeyS')||kd('ArrowDown')?1:0)+IN.mvy,-1,1),s=clamp((kd('KeyD')||kd('ArrowRight')?1:0)-(kd('KeyA')||kd('ArrowLeft')?1:0)+IN.mvx,-1,1);
  wx=-Math.sin(h.yaw)*k+Math.cos(h.yaw)*s;wz=-Math.cos(h.yaw)*k-Math.sin(h.yaw)*s;const L=Math.hypot(wx,wz);if(L>1){wx/=L;wz/=L;}}
 else{const a=(h.gA||0)+Math.sin(h.paraT*.45)*.7;wx=Math.cos(a);wz=Math.sin(a);}
 h.vx=lerp(h.vx,wx*5,dt*2.2);h.vz=lerp(h.vz,wz*5,dt*2.2);
 h.vy=lerp(h.vy,-3.4,dt*2.5);
 h.x=clamp(h.x+h.vx*dt,-WH+1,WH-1);h.z=clamp(h.z+h.vz*dt,-WH+1,WH-1);
 h.y+=h.vy*dt;
 const g=groundAt(h.x,h.z,HUMAN_R,h.y,.6);
 if(h.y<=g+.02){h.y=g;h.para=false;h.grounded=true;h.vx=h.vz=h.vy=0;h.landT=0;h.spawnProt=4;h.lastHitT=M.t;
  if(h===PL[0]){SFX.land(.35);M.banner=T('royLanded');M.bannerT=1.5;}}
}
/* ---- death: out for good if within the first minute after landing, otherwise respawn after 10 s ---- */
function royDead(h,dt){

 if(h.rsT<=0)royRespawn(h);
}
function royRespawn(h){
 h.alive=true;h.hp=100;h.arm=0;h.rsT=0;h.lastHitT=M.t;h.spawnProt=0;
 h.wid=['pistol','pistol'];h.slot=0;h.ammo=[WEAPONS.pistol.mag,WEAPONS.pistol.mag];h.res=[WEAPONS.pistol.res,WEAPONS.pistol.res];h.reload=0;
 if(ROY.t>=ROY.passEnd)royNewPass();
 h.inPlane=true;h.para=false;h.paraT=0;h.gA=rnd(0,TAU);h.dropAt=ROY.t+rnd(.1,.9)*Math.max(.5,ROY.passEnd-ROY.t);

 const p=royPlanePos();h.x=p[0];h.z=p[1];h.y=ROY.alt;h.vx=h.vz=h.vy=0;h.grounded=false;

/* ---- loot on the ground: pick up when standing on it ---- */
function royLoot(){
 ROY.f=(ROY.f||0)+1;const L=ROY.loot;if(!L.length)return;
 for(let i=L.length-1;i>=0;i--){const it=L[i];
  for(const h of PL){if(!h.alive||h.inPlane||h.para||h.y>2.5)continue;if(Math.hypot(h.x-it.x,h.z-it.z)>1.4)continue;royApply(h,it);L.splice(i,1);break;}}
}
function royApply(h,it){
 if(it.kind==='med')h.hp=Math.min(100,h.hp+45);
 else if(it.kind==='ammo'){for(let s=0;s<2;s++)h.res[s]+=WEAPONS[h.wid[s]].mag;}
 else if(it.kind.indexOf('arm')===0){h.arm=Math.min(150,(h.arm||0)+parseInt(it.kind.slice(3),10));}
 else{h.wid[0]=it.wid;h.ammo[0]=WEAPONS[it.wid].mag;h.res[0]=WEAPONS[it.wid].res;if(h.slot===0)h.reload=0;}
 if(h===PL[0]){M.banner=it.kind==='wpn'?WEAPONS[it.wid].name:T('royLoot_'+it.kind);M.bannerT=1.3;}
}

 for(let i=0;i<OW_ARM.length;i++){if((S.arm||0)>=OW_ARM[i][0])continue;add({id:'a'+i,cat:'gear',nm:T('owVest')+' '+(i+1),ds:'+'+OW_ARM[i][0]+' '+T('ar'),cost:OW_ARM[i][1],lv:OW_ARM[i][2],bench:0,go:()=>{S.arm=OW_ARM[i][0];const h=PL[0];if(h)h.arm=Math.max(h.arm,S.arm);}});break;}
 add({id:'med',cat:'gear',nm:T('r_med'),ds:'+65 '+T('hp'),cost:{cloth:6},lv:1,bench:0,go:()=>{S.inv.med++;}});
 add({id:'ammo',cat:'gear',nm:T('r_ammo'),ds:T('owAmmoD'),cost:{iron:5,sulfur:3},lv:1,bench:0,go:()=>{S.inv.ammo++;}});

 add({id:'b_fire',cat:'build',nm:T('owUse_fire'),ds:T('owPlaceD'),cost:{wood:20,stone:8},lv:1,bench:0,place:'fire'});

 return R;
}

 else{h.x+=(s.x-h.x)*k;h.z+=(s.z-h.z)*k;h.y+=(s.y-h.y)*k;}
 h.yaw+=angDiff(h.yaw,s.yaw)*k;h.pitch+=(s.pitch-h.pitch)*k;h.ch+=(s.ch-h.ch)*k;
 h.vx=s.vx;h.vz=s.vz;h.moveAmt=s.sp;h.walk+=s.sp*dt*2.4;
 h.grounded=!!s.g;h.slideT=s.sl?.5:0;h.ads=s.ads;h.hp=s.hp;
 h.slot=s.slot;h.wid=s.wid;h.reload=s.reload;h.rlDur=s.rlDur;h.rlEmpty=!!s.rlEmpty;

const PANEL={pdHp:[250,74],pdAm:[208,88],pdTop:[380,46],pdFps:[150,24],pdFeed:[300,130]};
/* draws a HUD panel (given in HUD units around its original centre cx,cy) at its saved place and scale */
function PANEL_T(id,Wv,Hv,cx,cy){const l=layoutOf(id);hx.translate(l.x*Wv,l.y*Hv);hx.scale(l.s,l.s);hx.translate(-cx,-cy);}
function remPx(){return parseFloat(getComputedStyle(document.documentElement).fontSize)||16;}
function defLay(id){
 const REM=remPx(),land=W>=H;
 if(id==='pdHp')return{x:137*HS/W,y:1-49*HS/H,s:1};
 if(id==='pdAm')return{x:1-116*HS/W,y:1-56*HS/H,s:1};
 if(id==='pdTop')return{x:.5,y:31*HS/H,s:1};
 if(id==='pdFps')return{x:1-44*HS/W,y:.2,s:1};
 if(id==='pdFeed')return{x:1-164*HS/W,y:151*HS/H,s:1};
 if(id==='bMenu')return land?{x:.045,y:.11}:{x:.1,y:.06};
 if(id==='bVoice')return land?{x:.13,y:.11}:{x:.22,y:.06};
 if(id==='bOpp')return land?{x:.22,y:.11}:{x:.34,y:.06};
 if(land){const a=BTN_LAND[id],sz=BTN_SZ[id];return{x:(W-(a[0]+sz/2)*REM)/W,y:(H-(a[1]+sz/2)*REM)/H};}
 const a=BTN_PORT[id];return{x:a[0],y:a[1]};
}
function layoutOf(id){
 const k=W>=H?'L':'P';const sv=SET.lay&&SET.lay[k]&&SET.lay[k][id];
 if(sv)return sv;const d=defLay(id);return{x:d.x,y:d.y,s:1};
}
function setLay(id,o){const k=W>=H?'L':'P';SET.lay=SET.lay||{};SET.lay[k]=SET.lay[k]||{};SET.lay[k][id]=o;}
function applyLayout(){
 const REM=remPx();
 for(const id of BTN_IDS){
  const el=$(id);if(!el)continue;
  const l0=layoutOf(id);
  if(PANEL[id]){const pw=PANEL[id][0]*HS*l0.s,ph=PANEL[id][1]*HS*l0.s;
   el.style.width=pw+'px';el.style.height=ph+'px';el.style.left=(l0.x*W-pw/2)+'px';el.style.top=(l0.y*H-ph/2)+'px';
   el.classList.toggle('hidden',!edOn);el.classList.toggle('sel',edOn&&edSel===id);continue;}
  if(edOn&&['bSkill','bVoice','bOpp'].includes(id))el.classList.remove('hidden');
  const l=l0,sz=BTN_SZ[id]*l.s*(SET.bsc||1)*REM,x=SET.lefty?1-l.x:l.x;
  el.style.width=el.style.height=sz+'px';
  el.style.left=clamp(x*W-sz/2,0,Math.max(0,W-sz))+'px';
  el.style.top=clamp(l.y*H-sz/2,0,Math.max(0,H-sz))+'px';
  el.style.right='auto';el.style.bottom='auto';
  el.classList.toggle('sel',edOn&&edSel===id);
 }
}

function teamColor(h){
